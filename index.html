<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Conversation Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
<script>
/* apply saved / system theme before first paint */
(function () {
  var t; try { t = localStorage.getItem("cc:theme"); } catch (e) {}
  document.documentElement.dataset.theme = t === "light" || t === "dark" ? t
    : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
})();
</script>
<style>
@property --pc { syntax: "<color>"; inherits: true; initial-value: #d9e2f2; }
@property --ink-on { syntax: "<color>"; inherits: true; initial-value: #2a2438; }
@property --bg { syntax: "<color>"; inherits: true; initial-value: #f6f1e9; }
@property --text { syntax: "<color>"; inherits: true; initial-value: #2a2438; }
@property --muted { syntax: "<color>"; inherits: true; initial-value: #7a7388; }
@property --surface { syntax: "<color>"; inherits: true; initial-value: rgb(255 255 255 / 62%); }
@property --line { syntax: "<color>"; inherits: true; initial-value: rgb(42 36 56 / 12%); }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #6a54e0; }
@property --on-accent { syntax: "<color>"; inherits: true; initial-value: #ffffff; }
@property --glow1 { syntax: "<percentage>"; inherits: true; initial-value: 55%; }
@property --glow2 { syntax: "<percentage>"; inherits: true; initial-value: 30%; }

:root {
  --pc: #d9e2f2; --ink-on: #2a2438;
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  transition: 0.7s ease;
  transition-property: --pc, --ink-on, --bg, --text, --muted, --surface, --line, --accent, --on-accent, --glow1, --glow2;
}
:root[data-theme="light"] { color-scheme: light; --bg: #f6f1e9; --text: #2a2438; --muted: #7a7388; --surface: rgb(255 255 255 / 62%);
  --line: rgb(42 36 56 / 12%); --accent: #6a54e0; --on-accent: #fff; --glow1: 55%; --glow2: 30%; }
:root[data-theme="dark"] { color-scheme: dark; --bg: #0c0d1c; --text: #ecebfa; --muted: #9a98bd; --surface: rgb(255 255 255 / 6%);
  --line: rgb(255 255 255 / 13%); --accent: #a99bff; --on-accent: #0c0d1c; --glow1: 24%; --glow2: 13%; }

* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(70rem 42rem at 75% -12%, color-mix(in srgb, var(--pc) var(--glow1), transparent), transparent 62%),
    radial-gradient(48rem 32rem at -5% 105%, color-mix(in srgb, var(--pc) var(--glow2), transparent), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.app { min-height: 100dvh; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font: 600 clamp(1.3rem, 3vw, 2rem)/1.1 var(--serif); letter-spacing: -0.015em; }
.sub { display: none; margin: 6px 0 0; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 10px; }
.count { padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted);
  font-size: .78rem; font-weight: 700; white-space: nowrap; }
.theme { position: relative; width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface);
  cursor: pointer; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.theme:hover { transform: rotate(18deg) scale(1.06); }
.theme svg { position: absolute; inset: 0; margin: auto; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .4s; }
:root[data-theme="light"] .moon { opacity: 0; transform: rotate(-90deg) scale(.4); }
:root[data-theme="dark"] .sun { opacity: 0; transform: rotate(90deg) scale(.4); }

.layout { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.label { display: none; margin: 4px 0 8px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.players, .topics { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px; margin: -4px; }
.players::-webkit-scrollbar, .topics::-webkit-scrollbar { display: none; }
.player { flex: none; display: flex; align-items: center; gap: 8px; padding: 4px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); cursor: pointer; transition: box-shadow .4s ease, border-color .4s ease, transform .2s; }
.player:hover { transform: translateY(-1px); }
.avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--c); color: var(--ci); font-weight: 800; }
.pname { display: none; padding-right: 10px; font-weight: 650; }
.player[aria-current="true"] { border-color: color-mix(in srgb, var(--c) 70%, var(--text)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent); }
.player[aria-current="true"] .pname { display: block; }
.chip { flex: none; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted);
  font-size: .82rem; font-weight: 650; cursor: pointer; transition: background .3s, color .3s, border-color .3s; }
.chip:hover { border-color: var(--muted); }
.chip.add { border-style: dashed; }
.players .chip { align-self: flex-start; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: transparent; }

.main { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage { position: relative; flex: none; height: clamp(310px, 49dvh, 510px); min-height: 310px; margin-bottom: 0; }
.deck { touch-action: pan-y; position: absolute; inset: 0; margin: auto; width: 100%; height: calc(100% - 26px); max-width: 760px; max-height: 600px;
  }
.layer { position: absolute; border-radius: 28px; border: 1px solid var(--line); background: var(--surface); }
.l1 { inset: 12px 14px -12px; opacity: .75; }
.l2 { inset: 24px 28px -24px; opacity: .4; }
/* One restrained transition per card change, without exit animation. */
.dealer { position: absolute; inset: 0; }
.dealer.deal { animation: deal 360ms cubic-bezier(.22, 1, .36, 1) both; }
@keyframes deal { from { opacity: .15; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
.tilt, .card { position: absolute; inset: 0; }
/* Keep the two card faces in place and crossfade without a 3D flip. */
.back, .front { transition: opacity 320ms ease, visibility 320ms ease; }
.back { opacity: 1; visibility: visible; }
.front { opacity: 0; visibility: hidden; }
.card.flipped .back { opacity: 0; visibility: hidden; pointer-events: none; }
.card.flipped .front { opacity: 1; visibility: visible; }
.face { position: absolute; inset: 0; overflow: hidden; border-radius: 28px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 30px 70px rgb(20 25 60 / 24%), inset 0 1px 0 rgb(255 255 255 / 40%); }
.face::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgb(255 255 255 / 26%), transparent 55%); }
.deck:hover .face::after { opacity: .35; }

.back { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; color: #fff;
  padding: clamp(24px, 5vw, 56px); cursor: pointer;
  background: linear-gradient(150deg, color-mix(in srgb, var(--pc) 50%, #2a3566), color-mix(in srgb, var(--pc) 22%, #0f1430)); }
.back::before { content: ""; position: absolute; inset: 14px; border-radius: 20px; border: 1px solid rgb(255 255 255 / 28%);
  background: radial-gradient(circle at 1px 1px, rgb(255 255 255 / 16%) 1px, transparent 1.6px) 0 0 / 18px 18px; }
.back > * { position: relative; }
.brand { font-size: .74rem; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; opacity: .8; }
.turn { font: 500 clamp(2.1rem, 6vw, 4rem)/1.05 var(--serif); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.hint { max-width: 32ch; margin: 0; font-size: clamp(.9rem, 1.6vw, 1.05rem); line-height: 1.55; opacity: .85; }

.front { display: flex; flex-direction: column; gap: 16px; padding: clamp(20px, 4.5vw, 48px); color: var(--ink-on);
  background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 85%, #fff), var(--pc)); }
.front::before { content: "\201C"; position: absolute; right: .1em; top: -.16em; font: 700 clamp(9rem, 26vw, 18rem)/1 var(--serif);
  color: color-mix(in srgb, var(--ink-on) 9%, transparent); pointer-events: none; }
.meta { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tag { padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--ink-on) 12%, transparent); font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.for { font-weight: 700; opacity: .75; overflow-wrap: anywhere; text-align: right; }
.qwrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.q { width: 100%; margin: 0; text-align: center; font-family: var(--serif); font-weight: 500; line-height: 1.2; letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }

.quote, .actions { width: 100%; max-width: 760px; margin-inline: auto; }
.quote { padding: 2px 8px; border: 0; border-radius: 0; background: transparent; animation: rise .5s ease both; text-align: center; }
.quote[hidden] { display: none; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.qlabel { display: flex; justify-content: center; gap: 8px; color: var(--muted); font-size: .75rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
.qlabel a { color: inherit; font-weight: 600; letter-spacing: 0; text-transform: none; }
.qtext { margin: 4px 0 0; font: italic 450 clamp(1.2rem, 2.3vw, 1.65rem)/1.4 var(--serif); text-wrap: balance; }
.qauthor { margin: 5px 0 0; color: var(--muted); font-size: 1rem; }

.actions { display: flex; gap: 10px; }
.btn { min-height: 54px; min-width: 0; padding: 0 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); font-weight: 750; font-size: 1.02rem;
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform .15s, opacity .3s, box-shadow .3s; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: wait; transform: none; }
.btn.primary { flex: 1.7; border-color: transparent; background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 34%, transparent); }
.btn.ghost { flex: 1; }
.btn.ghost[hidden], .status[hidden] { display: none; }
.keys { display: none; margin: 0; text-align: center; color: var(--muted); font-size: .8rem; }
.status { margin: 0; text-align: center; color: var(--muted); font-size: .85rem; line-height: 1.5; }

@media (min-width: 960px) {
  .app { padding-block: 28px; gap: 22px; }
  .sub { display: block; }
  .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 32px; }
  .side { align-self: start; gap: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .label { display: block; }
  .players { flex-direction: column; overflow: visible; }
  .player { border-radius: 18px; padding: 6px 12px 6px 6px; }
  .pname { display: block; flex: 1; text-align: left; }
  .topics { flex-wrap: wrap; overflow: visible; }
  .stage { height: clamp(420px, 55dvh, 560px); min-height: 420px; }
}
@media (hover: hover) and (min-width: 960px) { .keys { display: block; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

/* Text-first question display. No card surfaces, layers, flips, or tilt. */
.main { justify-content: flex-start; gap: clamp(17px, 2.5vh, 28px); }
.stage { flex: none; height: auto; min-height: clamp(235px, 39dvh, 410px); margin: 0; display: flex; align-items: center; justify-content: center; }
.deck { position: relative; inset: auto; margin: 0 auto; width: 100%; max-width: 820px; height: auto; max-height: none; touch-action: pan-y; }
.dealer, .card { position: relative; inset: auto; width: 100%; height: auto; }
.dealer.deal { animation: question-arrive 380ms cubic-bezier(.2,.72,.25,1) both; }
@keyframes question-arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.back, .front { position: relative; inset: auto; border: 0; border-radius: 0; box-shadow: none; background: transparent; color: var(--text); padding: 20px 0; text-align: center; transition: none; }
.back { display: flex; flex-direction: column; align-items: center; gap: 18px; cursor: pointer; opacity: 1; visibility: visible; }
.back::before, .front::before, .face::after { display: none !important; }
.front { display: none; flex-direction: column; gap: clamp(18px, 3vh, 30px); opacity: 1; visibility: visible; }
.card.flipped .back { display: none; }
.card.flipped .front { display: flex; }
.brand { font-size: .78rem; letter-spacing: .17em; color: var(--muted); opacity: 1; }
.turn { font-size: clamp(2.1rem, 5vw, 3.8rem); color: var(--text); }
.hint { color: var(--muted); opacity: 1; }
.meta { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px 24px; width: 100%; text-align: center; }
.meta-item { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.meta-item svg { width: 18px; height: 18px; flex: none; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.meta-topic { color: var(--muted); }
.meta-player { color: var(--text); }
.tag, .for { display: inline; min-width: 0; padding: 0; border: 0; border-radius: 0; background: none; overflow-wrap: anywhere; }
.tag { font-size: .88rem; font-weight: 700; letter-spacing: .02em; text-transform: none; color: inherit; }
.for { font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; opacity: 1; text-align: left; color: inherit; }
.tag::before, .for::before { content: none; }
.qwrap { display: block; flex: none; min-height: 0; margin-top: clamp(42px, 7vh, 75px); }
.q { max-width: 25ch; margin: 0 auto; font-size: clamp(2rem, 4.2vw, 3.8rem) !important; line-height: 1.2; font-weight: 500; }
.quote { margin-top: 0; }
.actions { max-width: 650px; }
@media (min-width: 960px) { .stage { height: auto; min-height: clamp(285px, 43dvh, 475px); } }
/* Compact phones: preserve readable text and keep controls within reach. */
@media (max-width: 600px) {
  .app { gap: 14px; padding: max(12px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }
  .top { gap: 8px; }
  h1 { font-size: clamp(1.25rem, 5.2vw, 1.55rem); }
  .tools { gap: 7px; }
  .count { font-size: .72rem; padding: 6px 9px; }
  .theme { width: 38px; height: 38px; flex: none; }
  .layout { gap: 20px; }
  .side { gap: 12px; }
  .players, .topics { gap: 7px; }
  .main { gap: clamp(18px, 3.5dvh, 28px); }
  .stage { min-height: clamp(220px, 36dvh, 320px); height: auto; }
  .front, .back { padding: 10px 0; }
  .front { gap: 0; }
  .meta { gap: 8px 17px; }
  .meta-item { gap: 6px; }
  .meta-item svg { width: 16px; height: 16px; }
  .tag { font-size: .78rem; }
  .for { font-size: .96rem; }
  .qwrap { margin-top: clamp(26px, 5dvh, 48px); }
  .q { max-width: 24ch; font-size: clamp(1.7rem, 6.5vw, 2.45rem) !important; line-height: 1.18; }
  .quote { padding: 0 4px; }
  .qlabel { font-size: .68rem; }
  .qtext { font-size: clamp(1.08rem, 4.5vw, 1.35rem); line-height: 1.38; }
  .qauthor { font-size: .85rem; }
  .actions { gap: 8px; }
  .btn { min-height: 50px; padding: 0 12px; font-size: .92rem; border-radius: 13px; }
  .btn.ghost { flex: .8; }
  .btn.primary { flex: 1.6; }
}
@media (max-width: 360px) {
  .app { padding-inline: 12px; }
  .q { font-size: clamp(1.55rem, 6.8vw, 1.8rem) !important; }
  .meta { gap: 7px 12px; }
  .btn { font-size: .84rem; padding-inline: 9px; }
}
@media (max-width: 600px) and (max-height: 700px) {
  .stage { min-height: 195px; }
  .main { gap: 16px; }
  .qwrap { margin-top: 24px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="title">Conversation Cards</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="tools">
      <span class="count" id="count">Loading…</span>
      <button class="theme" id="theme" type="button" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <div><span class="label">Players</span><div class="players" id="players" role="group" aria-label="Players"></div></div>
      <div><span class="label">Topics</span><div class="topics" id="topics" role="group" aria-label="Topics"></div></div>
    </aside>

    <main class="main">
      <section class="stage" aria-label="Current question">
        <div class="deck" id="deck">
          <div class="dealer" id="dealer">
            <div class="card" id="card">
              <div class="back" id="back">
                <span class="brand" id="brand">Conversation Cards</span>
                <div class="turn" id="turnName">Ready to begin?</div>
                <p class="hint">Take turns, listen, and share what you're comfortable sharing.</p>
              </div>
              <div class="front">
                <div class="meta">
                  <span class="meta-item meta-topic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4.8a2 2 0 0 1 2-2H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1"/></svg><span class="tag" id="tag"></span></span>
                  <span class="meta-item meta-player"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span class="for" id="forName"></span></span>
                </div>
                <div class="qwrap" id="qwrap" aria-live="polite"><p class="q" id="q"></p></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="quote" id="quote" hidden aria-live="polite" aria-label="A related quotation">
        <div class="qlabel"><span id="qtopic"></span><a id="credit" href="https://quotable.io/" target="_blank" rel="noopener noreferrer" hidden>via Quotable</a></div>
        <p class="qtext" id="qtext"></p>
        <p class="qauthor" id="qauthor"></p>
      </section>

      <div class="actions">
        <button class="btn ghost" id="pass" type="button" hidden>Pass</button>
        <button class="btn primary" id="primary" type="button">Start conversation</button>
      </div>
      <p class="keys">→ draw / next player &nbsp;·&nbsp; P pass</p>
      <p class="status" id="status" role="status" hidden></p>
      <input id="files" type="file" multiple hidden accept=".md,.markdown,.txt,text/markdown,text/plain" />
      <input id="datasetFiles" type="file" multiple hidden accept=".json,.md,.markdown,.txt" />
      <input id="sourceConfig" type="file" hidden accept=".json,application/json" />
    </main>
  </div>
</div>

<script>
/* Standalone file:// supported: embedded defaults, or select files via Load local dataset.
   GitHub and URL sources are supported through the Choose config.json control. */
const DEFAULT_CONFIG = {
  title: "Conversation Cards",
  subtitle: "Take turns, listen kindly, and remember that anyone can pass.",
  defaultTheme: "light",                       // "system" | "light" | "dark"
  quotes: true,                                 // false hides the quotation strip
  players: { source: "inline", items: [{name:"Player 1"}, {name:"Player 2"}, {name:"Player 3"}] },
  questions: { source: "inline", items: [
    {tag:"Icebreakers", question:"What small thing made you smile this week?"},
    {tag:"Icebreakers", question:"What is a skill you would love to master overnight?"},
    {tag:"Deeper Talks", question:"What is a lesson that took you years to learn?"},
    {tag:"Just For Fun", question:"What would you do with an unexpected free day?"}
  ] }
};
const PALETTE = ["#ffd6e0", "#d6e4ff", "#d9f2d9", "#fff0c2", "#e5d4ff", "#ffe0cc"];
const DEFAULT_PLAYERS = [{ name: "Player 1" }, { name: "Player 2" }, { name: "Player 3" }];
const BUILTIN_DECKS = {
  "icebreakers.md": `- What small thing made you smile this week?
- If you could have dinner with anyone, who would it be and why?
- What is a skill you would love to master overnight?
- What is the best meal you have ever had, and who were you with?
- What is something you are looking forward to?
- What was your first job, and what did it teach you?`,
  "deeper-talks.md": `- What is something you are proud of that few people know about?
- When did you last feel truly at ease, and what made it so?
- What is a lesson that took you years to learn?
- Who helped shape who you are today?
- What is a belief you hold today that you did not hold ten years ago?
- What would you like to be remembered for?`,
  "just-for-fun.md": `- You can add one rule to the world for a day. What is it?
- What would your theme song be?
- Which fictional place would you most like to visit?
- What is your most useless talent?
- What would you do with an unexpected free day?
- Which animal would be the best coworker?`
};
const FALLBACK_QUOTES = [
  { text: "It always seems impossible until it’s done.", author: "Nelson Mandela" },
  { text: "No act of kindness, no matter how small, is ever wasted.", author: "Aesop" },
  { text: "Knowing yourself is the beginning of all wisdom.", author: "Aristotle" },
  { text: "The secret of getting ahead is getting started.", author: "Mark Twain" }
];

const $ = (id) => document.getElementById(id);
const el = Object.fromEntries(["title","subtitle","brand","players","topics","count","deck","tilt","dealer","card","back","turnName","tag","forName",
  "qwrap","q","quote","qtopic","qtext","qauthor","credit","pass","primary","status","theme","files","datasetFiles","sourceConfig"].map((id) => [id, $(id)]));
const root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const state = { cfg: DEFAULT_CONFIG, players: [], turn: 0, bank: [], base: [], imported: [], active: new Set(), deck: [], current: null, busy: false, token: 0 };

const sleep = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const prettify = (f) => f.replace(/\.md$/i, "").replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
const stored = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

function inkFor(color) {
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec((color || "").trim());
  if (!m) return "#2a2438";
  let h = m[1]; if (h.length === 3) h = [...h].map((c) => c + c).join("");
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? "#2a2438" : "#ffffff";
}

/* ---------- theme ---------- */
function setTheme(t, save) {
  root.dataset.theme = t;
  el.theme.setAttribute("aria-label", t === "dark" ? "Switch to daylight mode" : "Switch to night mode");
  if (save) try { localStorage.setItem("cc:theme", t); } catch {}
}
el.theme.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark", true));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
  if (!stored("cc:theme") && state.cfg.defaultTheme === "system") setTheme(e.matches ? "dark" : "light", false);
});
setTheme(root.dataset.theme, false);

/* ---------- data ---------- */
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(`${url} (${r.status})`); return r.json(); }

// File-picker registry: local file:// access is granted only for user-selected files.
const localFiles = new Map();
const basename = p => String(p || "").replace(/\\/g, "/").split(/[?#]/)[0].split("/").pop();
const offlineMode = location.protocol === "file:";
function localFile(path) { return localFiles.get(String(path).replace(/^\.\//, "")) || localFiles.get(basename(path)); }
function currentConfig() { return state.cfg; }
async function applyDataset(cfg) {
  state.cfg = { ...DEFAULT_CONFIG, ...cfg };
  document.title = el.title.textContent = el.brand.textContent = state.cfg.title;
  el.subtitle.textContent = state.cfg.subtitle || "";
  let players;
  try { players = await loadPlayers(state.cfg.players); } catch (e) { console.warn(e); players = DEFAULT_PLAYERS; }
  state.players = players.map((p, i) => ({name:String(p.name).trim(), color:p.color || PALETTE[i % PALETTE.length]}));
  if (!state.players.length) state.players = DEFAULT_PLAYERS.map((p,i)=>({...p,color:PALETTE[i]}));
  state.turn = 0;
  state.current = null;
  state.token++;
  el.quote.hidden = true;
  el.card.classList.remove("flipped");
  const {bank,note} = await resolveQuestions(state.cfg);
  state.base = bank;
  state.imported = []; // A freshly loaded dataset must not mix with a previous deck.
  state.active.clear();
  refreshBank(); renderPlayers(); renderTopics(); rebuildDeck(); applyTurn(); updateActions();
  setStatus(note || `Loaded ${bank.length} questions and ${state.players.length} players.`);
}
async function chooseConfig(file) {
  let cfg;
  try { cfg = JSON.parse(await file.text()); if (!cfg || Array.isArray(cfg) || typeof cfg !== "object") throw Error("Expected a JSON object"); }
  catch (err) { setStatus(`Invalid configuration: ${err.message}`); return; }
  try { await applyDataset(cfg); } catch (err) { setStatus(`Could not load configuration: ${err.message}`); }
}
el.sourceConfig.addEventListener("change", async () => {
  const file = el.sourceConfig.files[0]; el.sourceConfig.value = "";
  if (file) await chooseConfig(file);
});
el.datasetFiles.addEventListener("change", async () => {
  const files = [...el.datasetFiles.files]; el.datasetFiles.value = "";
  if (!files.length) return;
  localFiles.clear();
  for (const f of files) {
    if (!localFiles.has(f.name)) localFiles.set(f.name, f);
    if (f.webkitRelativePath) localFiles.set(f.webkitRelativePath, f);
  }
  const configFile = files.find(f => /^(config|filepaths|github-sources|inline-sources|url-sources)\.json$/i.test(f.name));
  if (configFile) return chooseConfig(configFile);
  // Without config.json, auto-discover the selected players.json and question Markdown files.
  const md = files.filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  const cfg = {
    ...DEFAULT_CONFIG,
    players: files.some(f => f.name === "players.json") ? {source:"file",path:"players.json"} : DEFAULT_CONFIG.players,
    questions: md.length ? {source:"file",path:".",files:md.map(f=>f.name)} : DEFAULT_CONFIG.questions
  };
  await applyDataset(cfg);
});

async function loadConfig() {
  const url = new URLSearchParams(location.search).get("config") || "./config.json";
  try {
    if (offlineMode && !/^https?:\/\//i.test(url)) throw new Error("Local configuration requires user selection");
    const cfg = await getJSON(url);
    if (!cfg || typeof cfg !== "object" || Array.isArray(cfg)) throw new Error("Configuration must be an object");
    return { ...DEFAULT_CONFIG, ...cfg, found: true };
  } catch (err) {
    console.warn("Configuration unavailable; using embedded defaults:", err);
    return { ...DEFAULT_CONFIG, found: false };
  }
}

const readJSON = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const fileName = (u) => { const n = u.split(/[?#]/)[0].split("/").pop(); try { return decodeURIComponent(n); } catch { return n; } };
const remoteURL = (u) => /^https?:\/\//i.test(u);
const githubRaw = (s, p) => {
  if (!/^[\w.-]+\/[\w.-]+$/.test(s.repo || "")) throw new Error("Invalid GitHub repository; expected owner/repo");
  return `https://raw.githubusercontent.com/${s.repo}/${(s.ref || "main").split("/").map(encodeURIComponent).join("/")}/${p.split("/").map(encodeURIComponent).join("/")}`;
};
const sourceType = (s) => Array.isArray(s) ? "inline" : typeof s === "string" ? "file" : (s?.source === "local" ? "file" : s?.source || "file");
const sourcePath = (s) => typeof s === "string" ? s : (s.path || s.url || "");
const isRemote = (s) => sourceType(s) === "github" || sourceType(s) === "url" || (sourceType(s) === "file" && remoteURL(sourcePath(s)));

function resolveURL(s, path) {
  switch (sourceType(s)) {
    case "github": return githubRaw(s, path);
    case "file": case "url": return path;
    default: throw new Error("Unsupported data source: " + sourceType(s));
  }
}
function parseMarkdown(text, filename) {
  const tag = prettify(filename);
  return text.split(/\r?\n/).map((l) => l.trim())
    .filter((l) => l && !l.startsWith("#") && !/^[-*_=]{3,}$/.test(l))
    .map((l) => ({ tag, question: l.replace(/^([-*+]|\d+[.)])\s+/, "").trim() })).filter((x) => x.question);
}

async function questionURLs(q) {
  const type = sourceType(q);
  const path = sourcePath(q);
  if (type === "github") {
    if (q.files?.length) return q.files.map(f => githubRaw(q, `${path.replace(/\/$/, "")}/${f}`));
    const endpoint = `https://api.github.com/repos/${q.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(q.ref || "main")}`;
    const list = await getJSON(endpoint);
    if (!Array.isArray(list)) throw new Error("Expected a GitHub directory of Markdown files");
    return list.filter(f => f.type === "file" && /\.md$/i.test(f.name)).map(f => f.download_url);
  }
  if (type === "inline") return [];
  if (type !== "file" && type !== "url") throw new Error("Unknown questions source: " + type);
  if (q.files?.length) {
    if (offlineMode && type === "file") return q.files.map(f => `${path.replace(/\/?$/, "/")}${f}`);
    const base = path.replace(/\/?$/, "/");
    return q.files.map(f => remoteURL(f) ? f : resolveURL(q, new URL(f, new URL(base, location.href)).href));
  }
  if (/\.(md|markdown|txt)(\?.*)?$/i.test(path)) return [resolveURL(q, path)];
  if (!path) throw new Error("Questions source requires a path or files");
  // Compatibility with servers that return directory listings; explicit files are more portable.
  const base = path.replace(/\/?$/, "/"), response = await fetch(base);
  if (!response.ok) throw new Error("Directory listing unavailable: " + base);
  const html = await response.text();
  const names = [...html.matchAll(/href="([^"?#]+\.md)"/gi)].map(m => decodeURIComponent(m[1].split("/").pop()));
  if (!names.length) throw new Error("Add an explicit files array to the questions source");
  return [...new Set(names)].map(f => new URL(f, new URL(base, location.href)).href);
}

async function loadQuestions(q) {
  const remote = isRemote(q), key = "cc:q:" + JSON.stringify(q), cached = remote ? readJSON(key) : null;
  if (cached?.bank?.length && Date.now() - cached.t < 36e5) return cached.bank;
  try {
    let bank;
    if (sourceType(q) === "inline") {
      const items = Array.isArray(q) ? q : (q.items || []);
      bank = items.flatMap((x, i) => typeof x === "string"
        ? [{ tag: "General", question: x }]
        : x?.question ? [{ tag: x.tag || "General", question: x.question }] : []);
    } else {
      const urls = await questionURLs(q);
      const groups = await Promise.all(urls.map(async u => {
        const f = localFile(u);
        if (f && sourceType(q) === "file") return parseMarkdown(await f.text(), f.name);
        if (offlineMode && sourceType(q) === "file") throw new Error(`Choose the local file ${basename(u)}`);
        const r = await fetch(u, { cache: "no-store" });
        if (!r.ok) throw new Error(`${u} (${r.status})`);
        return parseMarkdown(await r.text(), fileName(u));
      }));
      bank = groups.flat();
    }
    if (!bank.length) throw new Error("No questions found in the configured source");
    if (remote) writeJSON(key, { t: Date.now(), bank });
    return bank;
  } catch (err) { if (cached?.bank?.length) return cached.bank; throw err; }
}
async function resolveQuestions(cfg) {
  try { return { bank: await loadQuestions(cfg.questions), note: "" }; }
  catch (err) {
    console.warn("Configured questions unavailable:", err);
    return { bank: Object.entries(BUILTIN_DECKS).flatMap(([name, md]) => parseMarkdown(md, name)),
      note: "Could not load the configured questions; showing built-in cards." };
  }
}
async function loadPlayers(p) {
  let list;
  if (sourceType(p) === "inline") list = Array.isArray(p) ? p : p.items;
  else {
    const path = resolveURL(p, sourcePath(p));
    const f = sourceType(p) === "file" ? localFile(path) : null;
    if (f) list = JSON.parse(await f.text());
    else if (offlineMode && sourceType(p) === "file" && !remoteURL(path)) throw new Error(`Choose the local file ${basename(path)}`);
    else list = await getJSON(path);
  }
  if (!Array.isArray(list)) throw new Error("Players source must be an array");
  return list.map(x => typeof x === "string" ? { name: x } : x)
    .filter(x => x && typeof x.name === "string" && x.name.trim());
}

/* ---------- deck ---------- */
function rebuildDeck() {
  const pool = state.active.size ? state.bank.filter((b) => state.active.has(b.tag)) : state.bank;
  state.deck = shuffle([...pool]); updateCount();
}
function nextItem() { if (!state.deck.length) rebuildDeck(); const it = state.deck.pop(); updateCount(); return it; }
function updateCount() { const n = state.deck.length; el.count.textContent = `${n} card${n === 1 ? "" : "s"} left`; }

/* ---------- render ---------- */
function renderPlayers() {
  el.players.replaceChildren(...state.players.map((p, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "player";
    b.style.setProperty("--c", p.color); b.style.setProperty("--ci", inkFor(p.color));
    const a = document.createElement("span"); a.className = "avatar"; a.textContent = Array.from(p.name)[0].toUpperCase();
    const n = document.createElement("span"); n.className = "pname"; n.textContent = p.name;
    b.append(a, n); b.addEventListener("click", () => selectPlayer(i)); return b;
  }), chipButton("Edit players", editPlayers, undefined, "add"));
}
function renderTopics() {
  const tags = [...new Set(state.bank.map((b) => b.tag))].sort();
  const mk = (label, pressed, fn) => { const c = document.createElement("button"); c.type = "button"; c.className = "chip";
    c.textContent = label; c.setAttribute("aria-pressed", pressed); c.addEventListener("click", fn); return c; };
  el.topics.replaceChildren(mk("All", state.active.size === 0, () => toggleTopic(null)), ...tags.map((t) => mk(t, state.active.has(t), () => toggleTopic(t))),
    chipButton("Load local dataset", () => el.datasetFiles.click(), undefined, "add"),
    chipButton("Choose config.json", () => el.sourceConfig.click(), undefined, "add"),
    chipButton("+ Add .md files", () => el.files.click(), undefined, "add"), ...(state.imported.length ? [chipButton("Clear added", clearImported, undefined, "add")] : []));
}
function chipButton(label, fn, pressed, cls) {
  const c = document.createElement("button"); c.type = "button"; c.className = "chip" + (cls ? " " + cls : ""); c.textContent = label;
  if (pressed !== undefined) c.setAttribute("aria-pressed", pressed); c.addEventListener("click", fn); return c;
}
function refreshBank() {
  state.bank = [...state.base, ...state.imported];
  state.active = new Set([...state.active].filter((t) => state.bank.some((b) => b.tag === t)));
}
function clearImported() { state.imported = []; writeJSON("cc:imported", []); refreshBank(); renderTopics(); rebuildDeck(); }
el.files.addEventListener("change", async () => {
  const added = [];
  for (const f of el.files.files) added.push(...parseMarkdown(await f.text(), f.name));
  el.files.value = "";
  if (!added.length) return;
  state.imported = [...state.imported, ...added]; writeJSON("cc:imported", state.imported);
  refreshBank(); renderTopics(); rebuildDeck();
});
async function editPlayers() {
  const input = prompt("Players, separated by commas:", state.players.map((p) => p.name).join(", "));
  if (input === null) return;
  const names = input.split(",").map((x) => x.trim()).filter(Boolean);
  if (!names.length) return;
  const old = state.players;
  state.players = names.map((name, i) => ({ name, color: old.find((p) => p.name === name)?.color || PALETTE[i % PALETTE.length] }));
  writeJSON("cc:players", state.players);
  playerQuotes.clear(); // edited player roster starts a new quote assignment
  await busy(async () => {
    if (state.current) { await play("out", 220); snapBack(); state.current = null; }
    state.turn = Math.min(state.turn, state.players.length - 1);
    renderPlayers(); applyTurn(); await play("deal", 380);
  });
}
function toggleTopic(tag) {
  if (tag === null) state.active.clear(); else state.active.has(tag) ? state.active.delete(tag) : state.active.add(tag);
  renderTopics(); rebuildDeck();
}
function applyTurn() {
  const p = state.players[state.turn];
  root.style.setProperty("--pc", p.color); root.style.setProperty("--ink-on", inkFor(p.color));
  el.turnName.textContent = `${p.name}’s turn`;
  [...el.players.children].forEach((b, i) => b.setAttribute("aria-current", i === state.turn ? "true" : "false"));
  el.players.children[state.turn]?.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce ? "auto" : "smooth" });
}
function updateActions() {
  const p = state.players[(state.turn + 1) % state.players.length];
  el.primary.textContent = state.current ? `Next: ${p.name} →` : "Start conversation";
  el.pass.hidden = !state.current;
  el.primary.disabled = el.pass.disabled = state.busy;
}
function setStatus(msg) { el.status.textContent = msg || ""; el.status.hidden = !msg; }

/* Text scales responsively via CSS. */

/* ---------- animation + flow ---------- */
async function play(cls, ms) { el.dealer.className = "dealer"; void el.dealer.offsetWidth; el.dealer.classList.add(cls); await sleep(ms); }
function snapBack() { el.card.classList.remove("flipped"); }
async function busy(fn) { if (state.busy) return; state.busy = true; updateActions(); try { await fn(); } finally { state.busy = false; updateActions(); } }

const deal = ({ turn, pass } = {}) => busy(async () => {
  const prev = state.current, item = nextItem();
  if (prev && pass) { state.deck.unshift(prev); updateCount(); }   // a passed card goes to the bottom of the deck
  if (turn !== undefined) { state.turn = turn; applyTurn(); }
  state.current = item;
  el.tag.textContent = item.tag; el.forName.textContent = state.players[state.turn].name; el.q.textContent = item.question;
  el.card.classList.add("flipped");
  await play("deal", 380);
  if (state.cfg.quotes) showQuote(item);
});
const draw = () => deal();                                                         // first card of the game
const nextPlayer = () => deal({ turn: (state.turn + 1) % state.players.length });  // one tap: next player AND their card
async function selectPlayer(i) {
  if (state.busy || i === state.turn) return;
  if (state.current) return deal({ turn: i });                                     // tapping a player deals them a card right away
  await busy(async () => { state.turn = i; applyTurn(); });
}
const primary = () => (state.current ? nextPlayer() : draw());

/* ---------- quote: one quotation per player until the page reloads ---------- */
const playerQuotes = new Map(); // player index -> Promise<quotation>
function setQuote(topic, text, author, credit) {
  el.quote.hidden = false;
  el.qtopic.textContent = topic;
  el.qtext.textContent = text;
  el.qauthor.textContent = author;
  el.credit.hidden = !credit;
}
async function fetchPlayerQuote(tag) {
  try {
    const topicTag = encodeURIComponent(tag.toLowerCase().replaceAll(" ", "-"));
    const r = await fetch(`https://api.quotable.io/quotes/random?limit=1&tags=${topicTag}`, { signal: AbortSignal.timeout(4000) });
    if (!r.ok) throw new Error("Quote service unavailable");
    const d = await r.json(), qu = Array.isArray(d) ? d[0] : d;
    if (!qu?.content) throw new Error("Empty quote");
    return { text: `“${qu.content}”`, author: `— ${qu.author || "Unknown"}`, credit: true };
  } catch {
    const f = pick(FALLBACK_QUOTES);
    return { text: `“${f.text}”`, author: `— ${f.author}`, credit: false };
  }
}
async function showQuote(item) {
  const player = state.turn;
  const token = ++state.token;
  const topic = `A thought for ${state.players[player].name}`;
  if (!playerQuotes.has(player)) playerQuotes.set(player, fetchPlayerQuote(item.tag));
  setQuote(topic, "Finding a quote…", "", false);
  const quote = await playerQuotes.get(player);
  if (token !== state.token || state.turn !== player) return;
  setQuote(topic, quote.text, quote.author, quote.credit);
}

/* ---------- events ---------- */
el.primary.addEventListener("click", primary);
el.pass.addEventListener("click", () => deal({ pass: true }));
el.back.addEventListener("click", () => { if (!state.current) draw(); });
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "arrowright" || k === "n") primary(); else if (k === "p" && state.current) deal({ pass: true });
});

let sx = null, sy = 0;
el.deck.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
el.deck.addEventListener("pointerup", (e) => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (state.current && Math.abs(dx) > 70 && Math.abs(dy) < 60) dx < 0 ? nextPlayer() : deal({ pass: true });
});

/* ---------- init ---------- */
(async function init() {
  const cfg = state.cfg = await loadConfig();
  document.title = el.title.textContent = el.brand.textContent = cfg.title;
  el.subtitle.textContent = cfg.subtitle || "";
  if (!stored("cc:theme") && (cfg.defaultTheme === "light" || cfg.defaultTheme === "dark")) setTheme(cfg.defaultTheme, false);

  let players = readJSON("cc:players");                                      // players edited on this device win
  if (!players?.length) players = await loadPlayers(cfg.players).catch(() => []);
  if (!players.length) players = DEFAULT_PLAYERS;
  state.players = players.map((x) => (typeof x === "string" ? { name: x } : x)).filter((x) => x && x.name)
    .map((p, i) => ({ name: String(p.name).trim(), color: p.color || PALETTE[i % PALETTE.length] }));

  const { bank, note } = await resolveQuestions(cfg);
  state.base = bank; state.imported = readJSON("cc:imported") || []; refreshBank();
  setStatus(note);
  renderPlayers(); renderTopics(); rebuildDeck(); applyTurn(); updateActions();
})();
</script>
</body>
</html>
